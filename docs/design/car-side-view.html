<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">הדמיה חיה של BYD ATTO 3 מהצד: דלתות, חלונות, תא מטען, מזגן, חימום מושבים, אורות, נעילה וטעינה</h2>
<style>
.st{position:relative;width:100%;aspect-ratio:680/300;border-radius:16px;overflow:hidden;background:linear-gradient(#18212E,#0E131B);perspective:640px;perspective-origin:46% 46%}
.fl{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.6,0,.3,1)}
.st.right .fl{transform:scaleX(-1)}
.ly{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:transform .8s cubic-bezier(.3,1.25,.5,1)}
.fd{transform-origin:34.3% 49%}.rd{transform-origin:55.4% 49%}.mr{transform-origin:36.5% 40.1%;transition-duration:.6s}
.tg{transform-origin:77% 23.4%;transition:transform 1.7s cubic-bezier(.45,.05,.3,1)}
.st.door-f .fd{transform:rotateY(-52deg)}.st.door-r .rd{transform:rotateY(-50deg)}.st.trunk .tg{transform:rotate(-68deg)}.st.locked .mr{transform:rotateY(62deg)}
.pane{transition:transform 1.9s cubic-bezier(.4,0,.4,1)}.st.win .pane{transform:translateY(30px)}
.air,.tint{opacity:0;transition:opacity .8s}.st.cold,.st.hot{--x:1}.st.cold{--air:#5CC8FF}.st.hot{--air:#FF8A4C}
.st.cold .air,.st.hot .air{opacity:1}.st.cold .tint,.st.hot .tint{opacity:.16}
.air path{stroke:var(--air,#5CC8FF);stroke-dasharray:18 26;animation:flow 1.1s linear infinite}.tint{fill:var(--air,#5CC8FF)}
@keyframes flow{to{stroke-dashoffset:-44}}
.heat{opacity:0;transition:opacity .9s}.st.seat .heat{opacity:.9}
.on{opacity:0;transition:opacity .12s}.st.lights .on{opacity:1}
.ring{opacity:0;transform-box:fill-box;transform-origin:center}.st.honk .ring{animation:ring 1.1s ease-out 2}
.st.honk .ring:nth-child(2){animation-delay:.25s}.st.honk .ring:nth-child(3){animation-delay:.5s}
@keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.cargo{opacity:0;transition:opacity .8s .5s}.st.trunk .cargo{opacity:1}.st:not(.trunk) .cargo{transition-delay:0s}.batt{opacity:0;transition:opacity .6s}.st.charging .batt{opacity:1}.sweep{opacity:0}.st.charging .sweep{opacity:1;animation:sweep 1.6s linear infinite}
@keyframes sweep{from{transform:translateX(-60px)}to{transform:translateX(190px)}}
.badge{position:absolute;left:50%;top:3%;width:38px;height:38px;margin-left:-19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;color:#0E131B;background:#2FD39A;opacity:0;transform:scale(.5);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.badge.show{opacity:1;transform:scale(1)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;direction:rtl}
.ctl button{font-size:13px;padding:7px 12px}.ctl button.act{background:var(--bg-accent,#dbeafe);color:var(--text-accent,#1d4ed8);border-color:var(--border-accent,#93c5fd)}
.cap{direction:rtl;font-size:13px;color:var(--text-secondary,#888);margin-top:10px;min-height:20px}
</style>

<script>
const st=document.getElementById('st'),cap=document.getElementById('cap'),badge=document.getElementById('badge'),bicon=document.getElementById('bicon');
const say=t=>cap.textContent=t;
const mark=(k,on)=>{const b=document.querySelector('[data-k="'+k+'"]');if(b)b.classList.toggle('act',on)};
let bt;function pop(locked){bicon.className='ti '+(locked?'ti-lock':'ti-lock-open');badge.style.background=locked?'#2FD39A':'#FFB648';badge.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>badge.classList.remove('show'),1400)}
function blink(n){let i=0;const f=()=>{st.classList.toggle('lights');if(++i<n*2)setTimeout(f,260)};f()}
function side(right){st.classList.toggle('right',right)}
const acts={
lock(){const l=!st.classList.contains('locked');st.classList.toggle('locked',l);pop(l);mark('lock',l);document.querySelector('[data-k="lock"]').textContent=l?'פתיחה':'נעילה';say(l?'נעול: המראות מתקפלות':'פתוח: המראות נפתחות')},
'door-f'(){side(false);const o=!st.classList.contains('door-f')||st.classList.contains('pside');st.classList.remove('pside');st.classList.toggle('door-f',o);mark('door-f',o);mark('pass',false);say(o?'דלת הנהג פתוחה':'דלת הנהג סגורה')},
'door-r'(){side(false);st.classList.remove('pside');const o=!st.classList.contains('door-r');st.classList.toggle('door-r',o);mark('door-r',o);say(o?'הדלת האחורית פתוחה':'הדלת האחורית סגורה')},
pass(){const o=!st.classList.contains('pside');st.classList.toggle('pside',o);if(o){st.classList.remove('door-f','door-r');mark('door-f',false);mark('door-r',false);side(true);setTimeout(()=>st.classList.add('door-f'),850)}else{st.classList.remove('door-f');setTimeout(()=>side(false),700)}mark('pass',o);say(o?'דלת הנוסע פתוחה: הרכב מסתובב לצד ימין':'דלת הנוסע סגורה')},
win(){const o=!st.classList.contains('win');st.classList.toggle('win',o);mark('win',o);say(o?'החלונות יורדים':'החלונות עולים')},
trunk(){const o=!st.classList.contains('trunk');st.classList.toggle('trunk',o);mark('trunk',o);say(o?'תא המטען נפתח, והאור בפנים נדלק':'תא המטען נסגר')},
cold(){const o=!st.classList.contains('cold');st.classList.remove('hot');mark('hot',false);st.classList.toggle('cold',o);mark('cold',o);say(o?'מזגן בקירור: רוח כחולה בתוך הרכב':'המזגן כבוי')},
hot(){const o=!st.classList.contains('hot');st.classList.remove('cold');mark('cold',false);st.classList.toggle('hot',o);mark('hot',o);say(o?'מזגן בחימום: רוח כתומה בתוך הרכב':'המזגן כבוי')},
seat(){const o=!st.classList.contains('seat');st.classList.toggle('seat',o);mark('seat',o);say(o?'חימום מושב הנהג פועל':'חימום המושב כבוי')},
flash(){st.classList.remove('lights');blink(2);say('האורות מהבהבים')},
find(){st.classList.remove('lights','honk');void st.offsetWidth;st.classList.add('honk');blink(3);setTimeout(()=>st.classList.remove('honk'),2400);say('צופר ואורות: כאן אני')},
charging(){const o=!st.classList.contains('charging');st.classList.toggle('charging',o);mark('charging',o);say(o?'בטעינה: הסוללה מתחת לרצפה מתמלאת':'הטעינה הופסקה')}
};
document.getElementById('ctl').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&acts[k])acts[k]()});
</script>
